  sadece-oyuncu: "&cBu komut sadece oyun içinde kullanılabilir."
  yenilendi: "&aEklenti konfigürasyonu başarıyla yenilendi!"
  envanter-dolu: "&cEnvanterin dolu olduğu için eşyayı toplayamadın!"
  sikistirildi: "&a{adet} &7adet blok yapıldı."
  sikistirilacak-yok: "&7Envanterinde bloğa çevrilecek bir şey yok."
  bilinmeyen: "&cBilinmeyen alt komut. &7/oto &cyaz."
  durum-acik: "&aAçık"
  durum-kapali: "&cKapalı"

